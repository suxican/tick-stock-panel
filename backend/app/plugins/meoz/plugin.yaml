# 猫爪数据 / 猫头鹰数据插件 (https://meoz.cn, https://t.meoz.cn)
# 纯 HTTP REST 源, 无额外依赖 (runtime: none); 两站共用同一 API Key。
# 需配置 MEOZ_API_KEY(或在设置页卡片填写), 未配置时插件灰显不可切换。

name: meoz
display_name: "猫爪数据"
runtime: none
entry: app.plugins.meoz.provider:MeozProvider
check: app.plugins.meoz.provider:availability
datasets: [realtime, daily, adj_factor, minute, full_minute]
api_key_env: MEOZ_API_KEY   # 声明后设置页提供 Key 输入框(先探后存, secrets.json 优先)
key_manage_url: "https://meoz.cn/console"
key_manage_label: "获取 Key / 查看用量"
description: "猫爪数据 HTTP API：A 股实时快照、日K（原始价）、除权因子、1 分钟K与全量分钟。五档盘口与财务未接入，按能力路由使用其他数据源。"
usage_notes:
  - "实时快照：股票全市场 1 个请求/轮；ETF、指数按需补拉"
  - "全量分钟：增量轮每根分钟 1 个全市场请求；修复轮 24 只/请求，全市场约 230 个请求"
  - "历史分钟：每交易日每 24 只 1 个请求；深历史更适合官网 Parquet 日包"
  - "限频：客户端全局约 3 次/秒；每日调用额度猫爪/猫头鹰两站共享，以套餐为准"
  - "分钟价格口径官方未写明：当日分钟按原价接入，历史分钟不声明价格口径"
  - "除权因子由累计因子相邻比值推导；出现比值小于 1 时整轮失败、不写入"
install_hint: "在下方输入框填写猫爪数据 API Key（个人中心获取），或配置环境变量 MEOZ_API_KEY"
homepage: "https://meoz.cn"
homepage_label: "猫爪数据官网"
